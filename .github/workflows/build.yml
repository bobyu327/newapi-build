name: build

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: upstream QuantumNous/new-api tag to build from
        default: v1.0.0-rc.34
        required: true
  push:
    branches: [main]
    paths:
      - patches/**
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Resolve base tag
        id: base
        run: |
          TAG="${{ github.event.inputs.base_tag }}"
          [ -n "$TAG" ] || TAG="v1.0.0-rc.34"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone upstream at ${{ steps.base.outputs.tag }}
        run: |
          git clone --depth 1 --branch "${{ steps.base.outputs.tag }}" \
            https://github.com/QuantumNous/new-api.git src

      - name: Apply patches
        working-directory: src
        run: |
          git config user.email ci@localhost
          git config user.name  "newapi-build ci"
          shopt -s nullglob
          for p in ../patchrepo/patches/*.patch; do
            echo "::group::apply $(basename "$p")"
            if ! git am --3way "$p"; then
              git am --abort || true
              git apply --3way "$p"
              git commit -am "apply $(basename "$p")"
            fi
            echo "::endgroup::"
          done
          git log --oneline -8

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api:${{ steps.base.outputs.tag }}-schemaclean
            ghcr.io/${{ github.repository_owner }}/new-api:latest

      - name: Summary
        run: |
          {
            echo "### Built \`ghcr.io/${{ github.repository_owner }}/new-api\`"
            echo ""
            echo "- \`${{ steps.base.outputs.tag }}-schemaclean\`"
            echo "- \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
